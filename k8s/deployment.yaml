apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp055-api
  labels:
    app: mp055-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp055-api
  template:
    metadata:
      labels:
        app: mp055-api
    spec:
      containers:
        - name: api
          image: mp055-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
